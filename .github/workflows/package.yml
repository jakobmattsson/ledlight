name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: volta-cli/action@v5
        with:
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
        run: npm exec --no -- worktree-keeper verify-release
      - run: npm publish
