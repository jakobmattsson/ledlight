name: Package compatibility

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update
      - run: sudo apt-get install --yes ledger
      - run: npm ci
      - run: npm run test:coverage
      - name: Show coverage in job summary
        if: ${{ always() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node scripts/ci/coverage-summary.js
      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            !coverage/tmp/**
            !coverage/lcov-report/**
          retention-days: 14

  publish-coverage:
    name: Publish coverage to gh-pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
      - name: Update gh-pages report
        run: |
          git fetch origin gh-pages
          git worktree add --detach pages-checkout refs/remotes/origin/gh-pages
          rm -rf pages-checkout/coverage
          cp -R coverage-report pages-checkout/coverage
          touch pages-checkout/.nojekyll
          if [ ! -f pages-checkout/index.html ]; then
            printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><title>Ledlight reports</title><p><a href="coverage/">Code coverage report</a></p><p><a href="dev/bench/">Benchmark history</a></p></html>' > pages-checkout/index.html
          fi
          git -C pages-checkout add -A
          if ! git -C pages-checkout diff --cached --quiet; then
            git -C pages-checkout -c user.name=github-actions -c user.email=github-actions[bot]@users.noreply.github.com commit -m "Update code coverage report"
            if ! git -C pages-checkout push origin HEAD:gh-pages; then
              git fetch origin gh-pages
              git -C pages-checkout rebase origin/gh-pages
              git -C pages-checkout push origin HEAD:gh-pages
            fi
          fi
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Show coverage report
        run: echo "[Browse line-by-line coverage](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/coverage/)" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Node.js 22 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:package
