version = 1
name = "ledlight"

[setup]
script = '''
set -e
export NVM_DIR="${NVM_DIR:-$HOME/.nvm}" # Keep a configured nvm path or use the default.
. "$NVM_DIR/nvm.sh" # Load nvm into this shell to select Node.
nvm use || nvm install
npm install
'''

[[actions]]
name = "Run tests"
icon = "run"
command = "npm test"
