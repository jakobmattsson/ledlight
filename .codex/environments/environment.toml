version = 1
name = "ledlight"

[setup]
script = '''
set -eo pipefail
if ! command -v volta >/dev/null 2>&1; then
  curl --proto '=https' --tlsv1.2 -fsS https://get.volta.sh \
    | bash -s -- --skip-setup
  export VOLTA_HOME="${VOLTA_HOME:-$HOME/.volta}"
  export PATH="$VOLTA_HOME/bin:$PATH"
fi
volta --version
npm ci
'''

[[actions]]
name = "Run tests"
icon = "run"
command = "npm test"
