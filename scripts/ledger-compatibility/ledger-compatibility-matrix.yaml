baseline:
  ledger: --args-only --no-pager --date-format %Y-%m-%d --file <journal>
  ledlight: --file <journal>

commands:
  accounts:
    ledlight: accounts
    ledger: accounts
  tags:
    ledlight: tags
    ledger: tags
  commodities:
    ledlight: commodities
    ledger: commodities
  prices:
    ledlight: prices
    ledger: prices --sort date,account
  transactions:
    ledlight: transactions --format text
    ledger: print
  balance:
    ledlight: aggregate --denominate
    ledger: balance --no-total --exchange SEK --flat
  balance-with-total:
    ledlight: aggregate --denominate --include-total
    ledger: balance --exchange SEK --flat
  balance-inverted:
    ledlight: aggregate --denominate --invert
    ledger: balance --no-total --exchange SEK --flat --invert
