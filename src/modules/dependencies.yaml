ubiquitous:
  - core
  - numeric
  - fs
  - path
  - zod

allowed-modules:
  numeric: []
  core: [numeric]
  journal: [core]
  accounting: [numeric, journal]
  database: [core, numeric, journal, accounting]
  queries: [core, numeric, accounting, database]
  commands: []
  project: [core, journal, database, queries]
  cli: [core, numeric, commands, project]

allowed-external:
  numeric: []
  core:
    - crypto
    - currentWorkingDirectory
    - envPaths
    - fs
    - path
    - processEnvironment
    - zod
  journal: [buffer, crypto, fs, path, zod]
  accounting: []
  database:
    - fs
    - path
    - processRuntime
    - schemaPath
    - sqlite
    - systemClock
  queries: [zod]
  commands: [commander]
  project: [fs, os, path]
  cli:
    - commander
    - currentWorkingDirectory
    - packageMetadata
    - processRuntime
    - standardInput
